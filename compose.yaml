# Tracewick capacity stand (sibling of tracewick/tracewick).
#
#   make up      observability + workload (nginx :8080) + drain
#   make down    stop and remove volumes
#
# Ports bind to 127.0.0.1 only.

name: tracewick-benchmarks

x-app-build: &app-build
  context: stand/app
  target: fpm
  args:
    PHP_VERSION: ${PHP_VERSION:-8.4}
    EXCIMER_VERSION: ${EXCIMER_VERSION:-1.2.6}
    TRACEWICK_VERSION: ${TRACEWICK_VERSION:-0.1.0}

x-app-env: &app-env
  TRACEWICK_SPOOL_DIR: ${TRACEWICK_SPOOL_DIR:-/var/spool/tracewick}
  TRACEWICK_ENABLED: ${TRACEWICK_ENABLED:-1}
  # Smoke may set 1.0; overhead "on" uses 0.1 (METHOD.md default).
  TRACEWICK_SAMPLE_RATE: ${TRACEWICK_SAMPLE_RATE:-0.1}
  TRACEWICK_SPOOL_MAX_FILES: ${TRACEWICK_SPOOL_MAX_FILES:-500}
  TRACEWICK_SERVICE: ${TRACEWICK_SERVICE:-benchmarks-workload}
  TRACEWICK_ENV: ${TRACEWICK_ENV:-bench}
  WORK_BUSY_MS: ${WORK_BUSY_MS:-25}
  WORK_SLEEP_MS: ${WORK_SLEEP_MS:-10}

services:
  pyroscope:
    image: ${PYROSCOPE_IMAGE:-grafana/pyroscope:2.4.2}
    ports:
      - 127.0.0.1:${PYROSCOPE_PORT:-4040}:4040

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.3.0}
    depends_on: [pyroscope]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./stand/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3000}:3000
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:3000/api/health]
      interval: 5s
      timeout: 3s
      retries: 24

  toxiproxy:
    image: ${TOXIPROXY_IMAGE:-ghcr.io/shopify/toxiproxy:2.13.0}
    profiles: [chaos]
    command: [-host=0.0.0.0, -config=/etc/toxiproxy/toxiproxy.json]
    volumes:
      - ./stand/toxiproxy/toxiproxy.json:/etc/toxiproxy/toxiproxy.json:ro
    ports:
      - 127.0.0.1:${TOXIPROXY_PORT:-8474}:8474

  app-fpm:
    build: *app-build
    image: tracewick-benchmarks-fpm:${TRACEWICK_VERSION:-0.1.0}
    environment:
      <<: *app-env
    volumes:
      - ./stand/app/public:/srv/app/public:ro
      - app-spool:/var/spool/tracewick
    depends_on: [pyroscope]
    healthcheck:
      test: [CMD-SHELL, php -r 'exit(extension_loaded("excimer")?0:1);']
      interval: 10s
      timeout: 3s
      retries: 12

  app-drain:
    image: tracewick-benchmarks-fpm:${TRACEWICK_VERSION:-0.1.0}
    user: www-data
    entrypoint: [vendor/bin/tracewick-drain]
    command: [--memory-limit=128M]
    environment:
      TRACEWICK_SPOOL_DIR: ${TRACEWICK_SPOOL_DIR:-/var/spool/tracewick}
      # Override to http://toxiproxy:14040 for chaos (make bench-chaos).
      TRACEWICK_PYROSCOPE_URL: ${TRACEWICK_PYROSCOPE_URL:-http://pyroscope:4040}
    volumes:
      - app-spool:/var/spool/tracewick
    depends_on: [pyroscope, app-fpm]
    restart: unless-stopped

  app-nginx:
    build:
      context: stand/app
      target: nginx
      args:
        NGINX_VERSION: ${NGINX_VERSION:-1.28.0}
    image: tracewick-benchmarks-nginx:${NGINX_VERSION:-1.28.0}
    depends_on:
      app-fpm:
        condition: service_started
    ports:
      - 127.0.0.1:${APP_PORT:-8080}:80
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/health]
      interval: 5s
      timeout: 3s
      retries: 24

volumes:
  app-spool:
