server {
    listen 80;
    server_name _;
    root /srv/app/public;

    location = /health {
        include fastcgi_params;
        fastcgi_pass app-fpm:9000;
        fastcgi_param SCRIPT_FILENAME /srv/app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /srv/app/public;
        fastcgi_param REQUEST_URI /health;
    }

    location / {
        include fastcgi_params;
        fastcgi_pass app-fpm:9000;
        fastcgi_param SCRIPT_FILENAME /srv/app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /srv/app/public;
    }
}
